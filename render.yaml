# Render.com Blueprint Configuration
# This file allows one-click deployment to Render

services:
  # PostgreSQL Database
  - type: pserv
    name: bugo-database
    env: docker
    plan: free
    region: singapore
    databases:
      - name: barangay_bugo_db
        user: bugo_user

  # Web Service (Backend + Frontend)
  - type: web
    name: bugo-sync-list
    env: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: bugo-database
          property: connectionString
      - key: APP_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: FORCE_HTTPS
        value: true
      - key: JWT_SECRET
        generateValue: true
      - key: HMAC_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 2h
      - key: BCRYPT_ROUNDS
        value: 12
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_RESIDENT_PASSWORD
        sync: false
